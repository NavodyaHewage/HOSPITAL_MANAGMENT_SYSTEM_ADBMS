# ============================================================================
#  Hospital Management System - backend configuration
# ============================================================================
spring.application.name=hms-backend
spring.profiles.active=dev

# ---------------------------------------------------------------------------
#  Datasource
# ---------------------------------------------------------------------------
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/hospital_management?useSSL=false&serverTimezone=Asia/Colombo&allowMultiQueries=true
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:1234}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.maximum-pool-size=15
spring.datasource.hikari.pool-name=hms-pool

# ---------------------------------------------------------------------------
#  JPA / Hibernate
#  The schema is owned by the scripts in database/ - never let Hibernate
#  generate it. validate makes startup fail loudly if an entity drifts.
# ---------------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# ---------------------------------------------------------------------------
#  JSON
# ---------------------------------------------------------------------------
spring.jackson.default-property-inclusion=non_null
spring.jackson.serialization.write-dates-as-timestamps=false

# ---------------------------------------------------------------------------
#  Server
# ---------------------------------------------------------------------------
server.port=${SERVER_PORT:8080}
server.servlet.context-path=/api

# ---------------------------------------------------------------------------
#  Application (bound by JwtProperties and CorsConfig)
# ---------------------------------------------------------------------------
app.jwt.secret=${JWT_SECRET:change-me-to-a-32-byte-minimum-secret-key}
app.jwt.access-token-expiry-minutes=60
app.jwt.refresh-token-expiry-days=7
app.cors.allowed-origins=http://localhost:4200

# ---------------------------------------------------------------------------
#  Docs
# ---------------------------------------------------------------------------
springdoc.swagger-ui.path=/swagger-ui.html

# ---------------------------------------------------------------------------
#  Logging
# ---------------------------------------------------------------------------
logging.level.com.hospital.hms=DEBUG
logging.level.org.springframework.jdbc.core=DEBUG
